# STOCK Act / Ethics in Government Act disclosure brackets.
#
# Transaction amounts are disclosed ONLY as ranges. Every dollar figure this
# pipeline derives is therefore an ESTIMATE. We store low/high/midpoint and the
# verbatim range text on every trade row, and stamp amount_is_estimate = true.
#
# The top bracket is open-ended ("over $50,000,000"). No midpoint exists for it;
# we use the lower bound and set amount_bound_open = true so it can be excluded
# from, or sensitivity-tested in, any dollar-weighted aggregate.

brackets:
  - {text: "$1,001 - $15,000",           low: 1001,     high: 15000}
  - {text: "$15,001 - $50,000",          low: 15001,    high: 50000}
  - {text: "$50,001 - $100,000",         low: 50001,    high: 100000}
  - {text: "$100,001 - $250,000",        low: 100001,   high: 250000}
  - {text: "$250,001 - $500,000",        low: 250001,   high: 500000}
  - {text: "$500,001 - $1,000,000",      low: 500001,   high: 1000000}
  - {text: "$1,000,001 - $5,000,000",    low: 1000001,  high: 5000000}
  - {text: "$5,000,001 - $25,000,000",   low: 5000001,  high: 25000000}
  - {text: "$25,000,001 - $50,000,000",  low: 25000001, high: 50000000}
  - {text: "over $50,000,000",           low: 50000001, high: null}

# Some House filings use a reduced bracket set for spouse/dependent-child rows.
aliases:
  "$1,001 - $15,000": ["$1,001-$15,000", "1001 - 15000", "$1001 - $15000"]
  "$15,001 - $50,000": ["$15,001-$50,000", "15001 - 50000"]
  "$50,001 - $100,000": ["$50,001-$100,000"]
  "$100,001 - $250,000": ["$100,001-$250,000"]
  "$250,001 - $500,000": ["$250,001-$500,000"]
  "$500,001 - $1,000,000": ["$500,001-$1,000,000", "$500,001 - $1,000,000"]
  "$1,000,001 - $5,000,000": ["$1,000,001-$5,000,000"]
